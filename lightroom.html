<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightroom — Abandon</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="app-zoom.js"></script>
<style>
/*
VOICE: Abandon 網站的 Lightroom：黑底、細灰框、白色微光，主色藍紫
IDEA: 發光的空白房間正中央懸浮著你的頭像
PICTURE: 全螢幕 3D 房間，真實五官與髮型的頭部網格與強烈影子
COLOUR and TYPE: 沿用 Abandon tokens：#0c0c0c、#434343、#3503ce；Noto Sans TC / Inter
LAYOUT: 3D 房間滿版，左上是自動偵測小窗，右側是五個打光選項，窄螢幕改為底部
*/
@font-face{font-family:"Noto Sans TC";src:url("fonts/NotoSansTC-subset.woff") format("woff");font-weight:100 900;font-display:swap}
@font-face{font-family:"Inter";src:url("fonts/Inter-subset.woff") format("woff");font-weight:100 900;font-display:swap}
:root{
  --color-bg:#0c0c0c;--color-stroke:#434343;--color-text:#fff;--color-text-muted:rgba(255,255,255,.5);
  --color-primary:#208;--color-primary-bright:#3503ce;--color-glow:#6d7dff;
  --font-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--font-en:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-card:20px;--shadow-qa:0 1px 2px rgba(0,0,0,.25);--ease:cubic-bezier(.22,.8,.3,1);--warn:#ff6b6b
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--color-bg);color:var(--color-text);font:16px/1.5 var(--font-zh);overflow:hidden}
#room{position:fixed;inset:0;touch-action:none;cursor:grab}
#room:active{cursor:grabbing}
#room canvas{display:block;width:100%!important;height:100%!important}
.panel{position:fixed;background:rgb(12 12 12 / .9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--color-stroke);border-radius:var(--radius-card);box-shadow:var(--shadow-qa);padding:20px}
h1{font-size:20px;line-height:1.3;margin:0 0 4px;font-weight:700}
h1 .en{font-family:var(--font-en);letter-spacing:.02em}
.sub{color:var(--color-text-muted);font-size:13px;margin:0 0 14px}
#cap{top:16px;left:16px;width:min(330px,calc(100vw - 32px))}
.view{position:relative;aspect-ratio:4/3;background:#000;border:1px solid var(--color-stroke);border-radius:14px;overflow:hidden}
.view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--color-text-muted);padding:16px;font-size:14px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
.bar{height:4px;border-radius:2px;background:#1d1d1d;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--color-primary-bright);box-shadow:0 0 10px var(--color-glow);transition:width .1s linear}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button{
  font:inherit;font-size:14px;line-height:1.4;min-height:44px;padding:8px 18px;
  border:1px solid var(--color-stroke);border-radius:27px;background:#000;color:var(--color-text);
  box-shadow:0 0 5px rgba(255,255,255,.2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:border-color .25s,box-shadow .25s,background-color .25s,transform .25s var(--ease)
}
button:is(:hover,:focus-visible){border-color:var(--color-text-muted);box-shadow:0 0 10px rgb(255 255 255 / .3)}
button:active{transform:scale(.98)}
button:focus-visible{outline:none}
button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.status{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:12px;color:#d4d4d4}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none;margin-top:6px}
.dot.on{background:var(--color-glow);box-shadow:0 0 8px var(--color-glow)}
.dot.busy{background:var(--color-primary-bright);box-shadow:0 0 8px var(--color-primary-bright)}
.dot.warn{background:var(--warn)}
.checks{list-style:none;margin:10px 0 0;padding:0;font-size:12px;color:var(--color-text-muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.checks li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid #666;margin-right:6px;vertical-align:1px}
.checks li.ok{color:var(--color-text)}.checks li.ok::before{background:var(--color-glow);border-color:var(--color-glow);box-shadow:0 0 6px var(--color-glow)}
.thumbs{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--color-text-muted);margin-top:12px}
.thumbs canvas{width:44px;height:44px;border-radius:10px;border:1px solid var(--color-stroke);background:#1d1d1d}
.collapse{position:absolute;top:14px;right:14px;min-height:32px;padding:2px 14px;font-size:12px}
#cap.min .body{display:none}
#lights{top:16px;right:16px;width:300px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts button{border-radius:16px;min-height:58px;padding:6px 4px}
.opts button[aria-checked=true]{background:var(--color-primary-bright);border-color:var(--color-primary-bright);box-shadow:0 0 30px rgb(53 3 206 / .55),inset 0 4px 4px rgba(0,0,0,.05);font-weight:700}
.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--color-text-muted);background:rgb(12 12 12 / .8);border:1px solid var(--color-stroke);padding:6px 14px;border-radius:27px;pointer-events:none;white-space:nowrap}
.back{position:fixed;left:16px;bottom:16px;z-index:5;min-height:44px;padding:8px 20px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-stroke);border-radius:27px;background:rgb(12 12 12 / .9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--color-text);font-size:14px;text-decoration:none;box-shadow:0 0 5px rgba(255,255,255,.2);transition:border-color .25s,box-shadow .25s,transform .25s var(--ease)}
.back:is(:hover,:focus-visible){border-color:var(--color-text-muted);box-shadow:0 0 10px rgb(255 255 255 / .3);outline:none}
.back:active{transform:scale(.98)}
@media(max-width:820px){
  #lights{top:auto;bottom:0;right:0;left:0;width:auto;border-radius:var(--radius-card) var(--radius-card) 0 0}
  #cap{width:min(270px,calc(100vw - 32px))}
  .hint{display:none}
  .back{left:auto;right:16px;bottom:auto;top:16px;padding:8px 14px}
}
</style>
<script src="button_sound.js?v=1122a" data-click-sound="audio/click.mp3" data-click-volume="0.85" defer></script>
</head>
<body>
<div id="room"></div>
<a class="back" href="apps.html" aria-label="返回網頁程式">← 返回</a>

<section class="panel" id="cap">
  <button class="collapse" id="capMin" type="button">收合</button>
  <h1><span class="en">Lightroom</span> 頭像</h1>
  <p class="sub">正面看鏡頭並保持不動，會自動拍下你的五官與髮型</p>
  <div class="body">
    <div class="view">
      <canvas id="preview"></canvas>
      <div class="empty" id="empty">正在載入偵測模型…</div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="progress"></i></div>
    <ul class="checks">
      <li id="ckFace">偵測到人臉</li>
      <li id="ckFront">正面看鏡頭</li>
      <li id="ckStill">保持不動</li>
    </ul>
    <div class="thumbs"><canvas id="faceThumb" width="96" height="96"></canvas>五官<canvas id="hairThumb" width="96" height="96"></canvas>髮型</div>
    <div class="status"><span class="dot busy" id="dot"></span><span id="statusText">正在載入偵測模型（第一次約需 10～20 秒）</span></div>
    <div class="row">
      <button id="againBtn" type="button" disabled>重新生成</button>
      <button id="camBtn" type="button" disabled>暫停鏡頭</button>
    </div>
  </div>
</section>

<section class="panel" id="lights" aria-label="燈光方向">
  <h1>燈光方向</h1>
  <p class="sub">選一種打光方式</p>
  <div class="opts" role="radiogroup" aria-label="燈光方向">
    <span></span><button type="button" role="radio" data-light="top" aria-checked="false">頂光</button><span></span>
    <button type="button" role="radio" data-light="left" aria-checked="false">左側光</button>
    <button type="button" role="radio" data-light="front" aria-checked="true">正面光</button>
    <button type="button" role="radio" data-light="right" aria-checked="false">右側光</button>
    <span></span><button type="button" role="radio" data-light="bottom" aria-checked="false">底光</button><span></span>
  </div>
</section>
<div class="hint">拖曳旋轉視角・滾輪縮放</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import {FilesetResolver,FaceLandmarker,ImageSegmenter} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $=id=>document.getElementById(id);
const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function setStatus(t,s){$('statusText').textContent=t;$('dot').className='dot'+(s?' '+s:'')}

/* ================= room ================= */
const host=$('room');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0c0c0c);
const cam=new THREE.PerspectiveCamera(48,1,.1,100);
const R=8,WALL_H=7,HEAD_Y=3.4,HEAD_SCALE=1.45;
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,.07);scene.add(hemi);
const wallM=new THREE.MeshStandardMaterial({color:0xe6e3dc,roughness:.95});
const floorM=new THREE.MeshStandardMaterial({color:0xbdb8ae,roughness:.9});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(R*2,R*2),floorM);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(R*2,R*2),wallM);ceil.rotation.x=Math.PI/2;ceil.position.y=WALL_H;ceil.receiveShadow=true;scene.add(ceil);
for(const w of[{pos:[0,0,R],rot:Math.PI},{pos:[0,0,-R],rot:0},{pos:[-R,0,0],rot:Math.PI/2},{pos:[R,0,0],rot:-Math.PI/2}]){
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(R*2,WALL_H),wallM);
  wall.position.set(w.pos[0],WALL_H/2,w.pos[2]);wall.rotation.y=w.rot;wall.receiveShadow=true;scene.add(wall);
}
const target=new THREE.Object3D();target.position.set(0,HEAD_Y,0);scene.add(target);

/* ================= lights: five fixed directions, full power ================= */
const POWER=3.2,LIGHT_COLOR='#fff4e5';
const frameM=new THREE.MeshStandardMaterial({color:0x222222,roughness:.5});
function wallBox(glow,p,rot){
  const g=new THREE.Group(),n=new THREE.Vector3(-Math.sign(p[0]),0,-Math.sign(p[2]));
  const f=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.4,.12),frameM);f.rotation.y=rot;f.position.set(...p).addScaledVector(n,.06);
  const d=new THREE.Mesh(new THREE.PlaneGeometry(2.3,1.1),glow);d.rotation.y=rot;d.position.set(...p).addScaledVector(n,.13);
  g.add(f,d);return g;
}
const RIG={
  top:{pos:[0,WALL_H-.35,.25],angle:.5,make(gl){const g=new THREE.Group();const f=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.12,48),frameM);f.position.y=WALL_H-.06;const d=new THREE.Mesh(new THREE.CircleGeometry(.95,48),gl);d.rotation.x=Math.PI/2;d.position.y=WALL_H-.13;g.add(f,d);return g}},
  bottom:{pos:[0,.4,2.2],angle:.6,make(gl){const g=new THREE.Group();const f=new THREE.Mesh(new THREE.BoxGeometry(1,.28,.7),frameM);f.position.set(0,.14,2.35);const d=new THREE.Mesh(new THREE.PlaneGeometry(.85,.45),gl);d.position.set(0,.29,2.3);d.rotation.x=-Math.PI/2.6;g.add(f,d);return g}},
  left:{pos:[-R+.4,HEAD_Y+.3,0],angle:.42,make(gl){return wallBox(gl,[-R,HEAD_Y+.3,0],Math.PI/2)}},
  right:{pos:[R-.4,HEAD_Y+.3,0],angle:.42,make(gl){return wallBox(gl,[R,HEAD_Y+.3,0],-Math.PI/2)}},
  front:{pos:[0,HEAD_Y+.6,R-.4],angle:.42,make(gl){return wallBox(gl,[0,HEAD_Y+.6,R],Math.PI)}}
};
for(const id in RIG){
  const L=RIG[id];L.glow=new THREE.MeshBasicMaterial({color:0x3a3a3a});scene.add(L.make(L.glow));
  const spot=new THREE.SpotLight(LIGHT_COLOR,POWER,0,L.angle,.35,1);
  spot.position.set(...L.pos);spot.castShadow=true;spot.shadow.mapSize.set(2048,2048);spot.shadow.bias=-.0003;spot.shadow.radius=2;
  spot.shadow.camera.near=.3;spot.shadow.camera.far=30;spot.target=target;spot.visible=false;scene.add(spot);L.spot=spot;
}
function setLight(id){
  for(const k in RIG){const on=k===id;RIG[k].spot.visible=on;RIG[k].glow.color.set(on?LIGHT_COLOR:'#3a3a3a')}
  document.querySelectorAll('[data-light]').forEach(b=>b.setAttribute('aria-checked',b.dataset.light===id));
}
document.querySelectorAll('[data-light]').forEach(b=>b.addEventListener('click',()=>setLight(b.dataset.light)));
setLight('front');

/* ================= head ================= */
const HEAD_R=.82,FACE_W=1.3;
const skinM=new THREE.MeshStandardMaterial({color:'#e9bfa0',roughness:.7});
const hairM=new THREE.MeshStandardMaterial({color:'#2b211c',roughness:.55,side:THREE.DoubleSide});
const hairFrontCan=document.createElement('canvas'),hairBackCan=document.createElement('canvas');hairFrontCan.width=hairFrontCan.height=hairBackCan.width=hairBackCan.height=4;
const hairFrontTex=new THREE.CanvasTexture(hairFrontCan);hairFrontTex.encoding=THREE.sRGBEncoding;
const hairBackTex=new THREE.CanvasTexture(hairBackCan);
const hairFrontM=new THREE.MeshStandardMaterial({map:hairFrontTex,alphaTest:.5,roughness:.5,side:THREE.DoubleSide});
const hairBackM=new THREE.MeshStandardMaterial({map:hairBackTex,color:'#2b211c',alphaTest:.5,roughness:.55,side:THREE.DoubleSide});
const snapCan=document.createElement('canvas');snapCan.width=snapCan.height=4;
const snapTex=new THREE.CanvasTexture(snapCan);snapTex.encoding=THREE.sRGBEncoding;
const faceM=new THREE.MeshStandardMaterial({map:snapTex,roughness:.6});
const float=new THREE.Group();float.position.y=HEAD_Y;float.scale.setScalar(HEAD_SCALE);scene.add(float);
let head=null;
function buildHead(p){
  if(head){float.remove(head);head.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  head=new THREE.Group();float.add(head);
  const add=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;head.add(o);return o};
  const ry=p.ry;
  const skull=add(new THREE.SphereGeometry(HEAD_R,64,40),skinM);skull.scale.y=ry/HEAD_R;
  for(const s of[-1,1]){const ear=add(new THREE.SphereGeometry(.15,16,12),skinM,s*HEAD_R*.97,-.08*ry,-.02);ear.scale.set(.5,1,.8)}
  if(p.face)add(p.face,faceM);
  else for(const s of[-1,1])add(new THREE.SphereGeometry(.07,16,12),hairM,s*.26,.08,HEAD_R*.94);
  if(p.hairFront){
    const f=add(p.hairFront,hairFrontM),b=add(p.hairBack,hairBackM);
    f.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:hairFrontTex,alphaTest:.5});
    b.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:hairBackTex,alphaTest:.5});
  }
  else{const hr=HEAD_R+.04;const cap=add(new THREE.SphereGeometry(hr,64,24,0,Math.PI*2,0,1.15),hairM);cap.scale.y=(ry+.04)/hr;cap.rotation.x=-.5}
}
buildHead({ry:.9});

/* ================= orbit ================= */
let rotY=.35,rotX=.12,dist=7.2,drag=null,pinch=null;
const look=new THREE.Vector3(0,HEAD_Y-.2,0);
const pts=new Map();
host.addEventListener('pointerdown',e=>{host.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag=[e.clientX,e.clientY]});
host.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)dist=Math.max(3,Math.min(7.6,dist*pinch/d));pinch=d;return}
  if(!drag)return;rotY-=(e.clientX-drag[0])*.008;rotX=Math.max(-.4,Math.min(1.2,rotX+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];
});
const up=e=>{pts.delete(e.pointerId);pinch=null;drag=pts.size?[...pts.values()][0]:null};
host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);
host.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3,Math.min(7.6,dist*(1+e.deltaY*.001)))},{passive:false});
$('capMin').addEventListener('click',()=>{const m=$('cap').classList.toggle('min');$('capMin').textContent=m?'展開':'收合'});
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(host);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();
const pose={yaw:0,pitch:0,roll:0},poseT={yaw:0,pitch:0,roll:0};
function render(){
  const t=clock.getElapsedTime();
  const d=dist*Math.cos(rotX);
  cam.position.set(Math.sin(rotY)*d,Math.max(.4,Math.min(WALL_H-.3,look.y+dist*Math.sin(rotX))),Math.cos(rotY)*d);cam.lookAt(look);
  for(const k in pose)pose[k]+=(poseT[k]-pose[k])*.18;
  const bob=reduce?0:Math.sin(t*1.3)*.08;
  float.position.y=HEAD_Y+bob;target.position.y=HEAD_Y+bob;
  float.rotation.set(pose.pitch,pose.yaw+(reduce?0:Math.sin(t*.7)*.04),pose.roll,'YXZ');
  renderer.render(scene,cam);requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* ================= geometry ================= */
const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
function circ(P,a,b,c){
  const[ax,ay]=P[a],[bx,by]=P[b],[cx,cy]=P[c];
  const d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));
  if(Math.abs(d)<1e-12)return{a,b,c,x:0,y:0,r2:Infinity};
  const a2=ax*ax+ay*ay,b2=bx*bx+by*by,c2=cx*cx+cy*cy;
  const x=(a2*(by-cy)+b2*(cy-ay)+c2*(ay-by))/d,y=(a2*(cx-bx)+b2*(ax-cx)+c2*(bx-ax))/d;
  return{a,b,c,x,y,r2:(ax-x)**2+(ay-y)**2};
}
function delaunay(pts){
  const n=pts.length;let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const[x,y]of pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const dm=Math.max(x1-x0,y1-y0)*20,mx=(x0+x1)/2,my=(y0+y1)/2;
  const P=pts.concat([[mx-dm,my-dm],[mx,my+dm],[mx+dm,my-dm]]);
  let tris=[circ(P,n,n+1,n+2)];
  for(let i=0;i<n;i++){
    const[px,py]=P[i],keep=[],edges=new Map();
    for(const t of tris){
      if((px-t.x)**2+(py-t.y)**2<t.r2){for(const[a,b]of[[t.a,t.b],[t.b,t.c],[t.c,t.a]]){const k=a<b?a+'_'+b:b+'_'+a;edges.set(k,edges.has(k)?null:[a,b])}}
      else keep.push(t);
    }
    tris=keep;for(const e of edges.values())if(e)tris.push(circ(P,e[0],e[1],i));
  }
  return tris.filter(t=>t.a<n&&t.b<n&&t.c<n).map(t=>[t.a,t.b,t.c]);
}
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}

// image pixel -> head coordinates (eyes levelled, face width = FACE_W)
function headFrame(lm,W,H){
  const P=lm.slice(0,468).map(p=>[p.x*W,p.y*H,p.z*W]);
  const fw=Math.hypot(P[454][0]-P[234][0],P[454][1]-P[234][1]);
  const cx=(P[10][0]+P[152][0])/2,cy=(P[10][1]+P[152][1])/2;
  const roll=Math.atan2(P[263][1]-P[33][1],P[263][0]-P[33][0]);
  const cr=Math.cos(-roll),sr=Math.sin(-roll),k=FACE_W/fw;
  const to=(x,y)=>{const dx=x-cx,dy=y-cy;return[(dx*cr-dy*sr)*k,-(dx*sr+dy*cr)*k]};
  return{P,k,to,fw};
}
function faceMesh(F,W,H){
  const{P,k,to}=F;
  const V=P.map(([x,y,z])=>{const[X,Y]=to(x,y);return[X,Y,-z*k]});
  const faceH=Math.abs(V[10][1]-V[152][1]);
  const ry=Math.max(.88,faceH/2+.1);
  const sz=(x,y)=>HEAD_R*Math.sqrt(Math.max(0,1-(x/HEAD_R)**2-(y/ry)**2));
  let off=0;for(const i of OVAL)off+=sz(V[i][0],V[i][1])-V[i][2];off/=OVAL.length;
  for(const v of V){v[2]+=off;v[2]=Math.max(v[2],sz(v[0],v[1])+.02)}
  const poly=OVAL.map(i=>[V[i][0],V[i][1]]);
  let tris=delaunay(V.map(v=>[v[0],v[1]])).filter(([a,b,c])=>inPoly((V[a][0]+V[b][0]+V[c][0])/3,(V[a][1]+V[b][1]+V[c][1])/3,poly));
  tris=tris.map(([a,b,c])=>((V[b][0]-V[a][0])*(V[c][1]-V[a][1])-(V[b][1]-V[a][1])*(V[c][0]-V[a][0]))<0?[a,c,b]:[a,b,c]);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(V.flat(),3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(P.flatMap(([x,y])=>[x/W,1-y/H]),2));
  g.setIndex(tris.flat());g.computeVertexNormals();
  return{geo:g,ry,poly,V};
}
// hair: smooth probability mask -> alpha-cut texture on a surface fitted to this person's hair volume
function hairMesh(F,W,H,prob,ry,facePoly,snap,win){
  const{to,fw}=F;
  // bounding box of confident hair inside the search window
  const st=Math.max(2,fw/50);let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity,n=0;
  for(let y=win.y0;y<win.y1;y+=st)for(let x=win.x0;x<win.x1;x+=st)if(prob(x,y)>.4){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);n++}
  if(n<40)return null;
  const pad=fw*.08;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W,x1+pad);y1=Math.min(H,y1+pad);
  // measure the hairstyle in head units
  let side=HEAD_R+.04,top=ry+.04,bottom=0,topCover=0,topCount=0;
  for(let y=y0;y<y1;y+=st)for(let x=x0;x<x1;x+=st){
    const[X,Y]=to(x,y),p=prob(x,y);
    if(Y>ry*.55&&Y<ry&&Math.abs(X)<.45){topCount++;topCover+=p}
    if(p<.5)continue;
    if(Math.abs(Y)<.35)side=Math.max(side,Math.abs(X));
    top=Math.max(top,Y);bottom=Math.min(bottom,Y);
  }
  const hx=Math.min(1.45,side+.02),hy=Math.min(ry+.6,top+.02),hz=HEAD_R+.05+(hx-HEAD_R-.05)*.55;
  const covered=topCount?topCover/topCount>.3:false; // false: bald / very short hair -> don't invent hair at the back
  const zAt=(X,Y)=>{const t=1-(X/hx)**2-(Y/hy)**2;return Math.max(.1,hz*Math.sqrt(Math.max(0,t)))};
  // textures
  const TW=512,TH=Math.max(64,Math.round(TW*(y1-y0)/(x1-x0)));
  hairFrontCan.width=hairBackCan.width=TW;hairFrontCan.height=hairBackCan.height=TH;
  const fctx2=hairFrontCan.getContext('2d'),bctx=hairBackCan.getContext('2d');
  fctx2.drawImage(snap,x0,y0,x1-x0,y1-y0,0,0,TW,TH);
  const fd=fctx2.getImageData(0,0,TW,TH),bd=bctx.createImageData(TW,TH);
  const ss=(a,b,v)=>{const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t)};
  for(let j=0;j<TH;j++)for(let i=0;i<TW;i++){
    const x=x0+(i+.5)/TW*(x1-x0),y=y0+(j+.5)/TH*(y1-y0),o=(j*TW+i)*4;
    const[X,Y]=to(x,y);let p=prob(x,y);
    if(Y<.35&&inPoly(X,Y,facePoly))p=0; // never cover eyes, nose, mouth
    const a=ss(.3,.6,p);fd.data[o+3]=a*255;
    const inHead=1-(X/hx)**2-(Y/hy)**2>0&&Y>-ry*.6;
    const b=covered&&inHead?1:a;
    bd.data[o]=bd.data[o+1]=bd.data[o+2]=255;bd.data[o+3]=b*255;
  }
  fctx2.putImageData(fd,0,0);bctx.putImageData(bd,0,0);hairFrontTex.needsUpdate=hairBackTex.needsUpdate=true;
  // geometry: one grid over the box, front surface and mirrored back surface
  const nx=Math.min(160,Math.ceil((x1-x0)/(fw/40))),ny=Math.min(180,Math.ceil((y1-y0)/(fw/40)));
  const pos=[],posB=[],uv=[],idx=[];
  for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){
    const u=i/nx,v=j/ny,x=x0+u*(x1-x0),y=y0+v*(y1-y0);const[X,Y]=to(x,y);const Z=zAt(X,Y);
    pos.push(X,Y,Z);posB.push(X,Y,-Z);uv.push(u,1-v);
  }
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=j*(nx+1)+i,b=a+1,c=a+nx+1,d=c+1;idx.push(a,c,b,b,c,d)}
  const mk=(P)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx.slice());g.computeVertexNormals();return g};
  return{front:mk(pos),back:mk(posB),long:bottom<-ry*.9,covered,hx,hy};
}

/* ================= detection ================= */
const video=document.createElement('video');video.playsInline=true;video.muted=true;
const frame=document.createElement('canvas'),fctx=frame.getContext('2d',{willReadFrequently:true});
const prev=$('preview'),pctx=prev.getContext('2d');
let face=null,seg=null,stream=null,running=false;
let state='loading',progress=0,lastT=0,lastCenter=null,lostAt=0,baseRatio=.42;

async function loadModels(){
  const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const mk=async(Cls,opts)=>{try{return await Cls.createFromOptions(fs,{...opts,baseOptions:{...opts.baseOptions,delegate:'GPU'}})}catch(e){return await Cls.createFromOptions(fs,{...opts,baseOptions:{...opts.baseOptions,delegate:'CPU'}})}};
  [face,seg]=await Promise.all([
    mk(FaceLandmarker,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},runningMode:'VIDEO',numFaces:1}),
    mk(ImageSegmenter,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite'},runningMode:'IMAGE',outputCategoryMask:false,outputConfidenceMasks:true})
  ]);
}
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    video.srcObject=stream;await video.play();running=true;$('empty').hidden=true;$('camBtn').textContent='暫停鏡頭';$('camBtn').disabled=false;
    if(state!=='done')state='search';requestAnimationFrame(loop);
  }catch(e){setStatus('無法開啟攝影機：請點網址列左側的圖示允許攝影機，然後重新整理','warn');$('empty').hidden=false;$('empty').textContent='需要攝影機權限'}
}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;running=false;$('camBtn').textContent='開啟鏡頭'}
$('camBtn').addEventListener('click',()=>{running?stopCam():startCam()});
$('againBtn').addEventListener('click',()=>{state='search';progress=0;setStatus('重新偵測中，請正面看鏡頭','busy')});

const mark=(id,ok)=>$(id).classList.toggle('ok',!!ok);
function measures(lm,W,H){
  const p=i=>[lm[i].x*W,lm[i].y*H];
  const L=p(234),Rr=p(454),N=p(1),E1=p(33),E2=p(263),C=p(152);
  const fw=Math.hypot(Rr[0]-L[0],Rr[1]-L[1]);
  const ey=(E1[1]+E2[1])/2;
  return{fw,yawN:(N[0]-(L[0]+Rr[0])/2)/fw*2,roll:Math.atan2(E2[1]-E1[1],E2[0]-E1[0]),ratio:(N[1]-ey)/Math.max(1,C[1]-ey),center:[(L[0]+Rr[0])/2,(ey+C[1])/2]};
}
function loop(now){
  if(!running)return;
  if(video.readyState<2){requestAnimationFrame(loop);return}
  const W=video.videoWidth,H=video.videoHeight;
  if(frame.width!==W){frame.width=prev.width=W;frame.height=prev.height=H}
  fctx.drawImage(video,0,0,W,H);
  const fr=face.detectForVideo(frame,performance.now());
  const lm=fr.faceLandmarks&&fr.faceLandmarks[0];
  pctx.drawImage(frame,0,0);
  const dt=Math.min(.1,(now-(lastT||now))/1000);lastT=now;
  let m=null,front=false,still=false;
  if(lm){
    m=measures(lm,W,H);
    front=Math.abs(m.yawN)<.16&&Math.abs(m.roll)<.2&&m.fw>W*.07;
    const mv=lastCenter?Math.hypot(m.center[0]-lastCenter[0],m.center[1]-lastCenter[1])/m.fw:1;lastCenter=m.center;still=mv<.035;
    pctx.strokeStyle='#6d7dff';pctx.lineWidth=Math.max(2,W/400);pctx.beginPath();
    OVAL.forEach((i,j)=>{const x=lm[i].x*W,y=lm[i].y*H;j?pctx.lineTo(x,y):pctx.moveTo(x,y)});pctx.closePath();pctx.stroke();
    pctx.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<468;i+=3)pctx.fillRect(lm[i].x*W-1,lm[i].y*H-1,2,2);
    if(state==='done'){
      poseT.yaw=Math.max(-.7,Math.min(.7,m.yawN*1.1));poseT.roll=-m.roll;poseT.pitch=Math.max(-.35,Math.min(.35,(m.ratio-baseRatio)*1.6));lostAt=0;
    }
  }else{lastCenter=null;if(state==='done'){if(!lostAt)lostAt=now;else if(now-lostAt>2500){state='search';progress=0;poseT.yaw=poseT.pitch=poseT.roll=0}}}
  mark('ckFace',lm);mark('ckFront',front);mark('ckStill',still&&front);
  if(state==='search'){
    const ok=lm&&front&&still;
    progress=ok?progress+dt/1.2:Math.max(0,progress-dt*.8);
    if(!lm)setStatus('請站到鏡頭前','');
    else if(!front)setStatus('請正面看鏡頭、頭擺正','warn');
    else setStatus('保持不動…即將自動拍照','busy');
    if(progress>=1){progress=0;capture(lm,W,H,m)}
  }
  $('progress').style.width=(state==='search'?Math.min(1,progress)*100:0)+'%';
  requestAnimationFrame(loop);
}

function capture(lm,W,H,m){
  state='busy';setStatus('拍照中，正在生成頭像…','busy');
  const fl=$('flash');fl.style.transition='none';fl.style.opacity=.9;requestAnimationFrame(()=>{fl.style.transition='opacity .5s';fl.style.opacity=0});
  snapCan.width=W;snapCan.height=H;const s=snapCan.getContext('2d',{willReadFrequently:true});s.drawImage(frame,0,0);
  const img=s.getImageData(0,0,W,H).data;
  // confidence masks: 0 bg, 1 hair, 2 body skin, 3 face skin, 4 clothes, 5 other
  const res=seg.segment(snapCan);const cm=res.confidenceMasks;const mw=cm[0].width,mh=cm[0].height;
  const hairP=cm[1].getAsFloat32Array().slice(),faceP=cm[3].getAsFloat32Array().slice();res.close();
  const sample=(A,x,y)=>{const fx=Math.max(0,Math.min(mw-1.001,x*mw/W-.5)),fy=Math.max(0,Math.min(mh-1.001,y*mh/H-.5));const i=fx|0,j=fy|0,u=fx-i,v=fy-j,o=j*mw+i;
    return A[o]*(1-u)*(1-v)+A[o+1]*u*(1-v)+A[o+mw]*(1-u)*v+A[o+mw+1]*u*v};
  const avgWhere=(A,th,x0,y0,x1,y1)=>{let r=0,g=0,b=0,n=0;x0=Math.max(0,x0|0);y0=Math.max(0,y0|0);x1=Math.min(W,x1|0);y1=Math.min(H,y1|0);
    for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){if(sample(A,x,y)<th)continue;const i=(y*W+x)*4;r+=img[i];g+=img[i+1];b+=img[i+2];n++}
    return n>20?hex(r/n,g/n,b/n):null};
  const F=headFrame(lm,W,H);
  const fm=faceMesh(F,W,H);
  snapTex.needsUpdate=true;
  const fx0=Math.min(...OVAL.map(i=>lm[i].x*W)),fx1=Math.max(...OVAL.map(i=>lm[i].x*W)),fy0=Math.min(...OVAL.map(i=>lm[i].y*H)),fy1=Math.max(...OVAL.map(i=>lm[i].y*H));
  const fwid=fx1-fx0,fhei=fy1-fy0;
  skinM.color.set(avgWhere(faceP,.7,fx0,fy0,fx1,fy1)||'#e9bfa0');
  // only hair connected to this head: limit to a window around the face
  const wx0=Math.max(0,fx0-fwid*1.6),wx1=Math.min(W,fx1+fwid*1.6),wy0=Math.max(0,fy0-fhei*1.2),wy1=Math.min(H,fy1+fhei*2.4);
  const prob=(x,y)=>(x<wx0||x>wx1||y<wy0||y>wy1)?0:sample(hairP,x,y);
  const isHair=(x,y)=>prob(x,y)>.5;
  const hc0=avgWhere(hairP,.75,wx0,wy0,wx1,wy1)||'#2b211c';hairM.color.set(hc0);hairBackM.color.set(hc0);
  const hm=hairMesh(F,W,H,prob,fm.ry,fm.poly,snapCan,{x0:wx0,y0:wy0,x1:wx1,y1:wy1});
  buildHead({ry:fm.ry,face:fm.geo,hairFront:hm&&hm.front,hairBack:hm&&hm.back,long:hm&&hm.long});
  baseRatio=m.ratio;state='done';lostAt=0;
  // thumbnails
  const side=Math.max(fwid,fhei)*1.1;
  const ft=$('faceThumb').getContext('2d');ft.clearRect(0,0,96,96);ft.drawImage(snapCan,(fx0+fx1)/2-side/2,(fy0+fy1)/2-side/2,side,side,0,0,96,96);
  const hs=Math.max(wx1-wx0,wy1-wy0),hc=document.createElement('canvas');hc.width=hc.height=96;const hctx=hc.getContext('2d'),hid=hctx.createImageData(96,96);
  for(let y=0;y<96;y++)for(let x=0;x<96;x++){const sx=(wx0+wx1)/2-hs/2+x/96*hs,sy=wy0+y/96*hs,o=(y*96+x)*4;if(isHair(sx,sy)){const i=((sy|0)*W+(sx|0))*4;hid.data[o]=img[i];hid.data[o+1]=img[i+1];hid.data[o+2]=img[i+2];hid.data[o+3]=255}}
  hctx.putImageData(hid,0,0);const ht=$('hairThumb').getContext('2d');ht.fillStyle='#333';ht.fillRect(0,0,96,96);ht.drawImage(hc,0,0);
  $('againBtn').disabled=false;
  setStatus(hm?'頭像已生成！轉頭時會跟著動；離開鏡頭再回來會重新生成':'頭像已生成（沒偵測到頭髮，使用預設髮型）','on');
}

/* ================= boot ================= */
(async()=>{
  try{await loadModels()}catch(e){setStatus('偵測模型載入失敗，請確認網路連線後重新整理','warn');$('empty').textContent='模型載入失敗';console.error(e);return}
  $('empty').textContent='正在開啟攝影機…';setStatus('模型已載入，正在開啟攝影機','busy');
  startCam();
})();
</script>
